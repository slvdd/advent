name: release
on:
  workflow_dispatch:
    inputs:
      open:
        description: 'id'
        required: false
        default: ''
permissions:
  contents: write
  pages: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: run
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OPEN: ${{ inputs.open }}
          LOOKAHEAD_MIN: ${{ github.event_name == 'workflow_dispatch' && '330' || '25' }}
        run: |
          git config user.name slvdd
          git config user.email slvdd@noreply.invalid
          node tools/release.mjs
